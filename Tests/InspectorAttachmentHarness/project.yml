name: InspectorAttachmentChecks
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  RipulAgent:
    path: ../..
targets:
  InspectorAttachmentHost:
    type: application
    platform: iOS
    sources: [App.swift, Harness.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ripul.inspector-attachment-tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: RipulAgent
  ComposerAttachmentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../RipulAgentTests/ComposerContextTests.swift
      - ../RipulAgentTests/ComposerScreenOptionsTests.swift
      - ../RipulAgentTests/ComposerElementContextTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ripul.composer-attachment-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InspectorAttachmentHost
      - package: RipulAgent
  InspectorAttachmentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ripul.inspector-attachment-ui-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InspectorAttachmentHost
schemes:
  InspectorAttachmentChecks:
    build:
      targets:
        InspectorAttachmentHost: all
        ComposerAttachmentTests: [test]
        InspectorAttachmentUITests: [test]
    test:
      targets: [ComposerAttachmentTests, InspectorAttachmentUITests]
