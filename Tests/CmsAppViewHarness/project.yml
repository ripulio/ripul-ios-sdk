name: CmsAppViewChecks
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  RipulAgent:
    path: ../..
targets:
  CmsAppViewHost:
    type: application
    platform: iOS
    sources: [App.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ripul.tests.cms-app-view-host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: RipulAgent
  CmsAppViewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ripul.tests.cms-app-view-ui-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: CmsAppViewHost
schemes:
  CmsAppViewChecks:
    build:
      targets:
        CmsAppViewHost: all
        CmsAppViewUITests: [test]
    test:
      targets: [CmsAppViewUITests]
